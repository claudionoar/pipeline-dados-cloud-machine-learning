AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Arquitetura equivalente 100% AWS para o pipeline Amazon Sales & Reviews (item 4.5 do
  enunciado). A implementação real do projeto usa Airflow+dbt em Docker e Snowflake como base
  analítica; este template documenta como o mesmo pipeline seria construído usando apenas
  serviços gerenciados da AWS (S3 -> Glue -> Redshift Serverless -> SageMaker), com QuickSight
  e MWAA descritos em docs/arquitetura.md como substitutos de Metabase/Airflow (não
  implantados aqui por exigirem VPC dedicada e terem custo fixo elevado - ver
  cloudformation/README.md).

Parameters:
  ProjectName:
    Type: String
    Default: amazon-pipeline
    Description: Prefixo usado no nome dos recursos.

  BucketSuffix:
    Type: String
    Description: Sufixo único para o nome do bucket S3 (nomes de bucket são globais na AWS).

  EnableRedshift:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >
      Cria um namespace/workgroup Redshift Serverless (substituto do Snowflake). Mantido
      desligado por padrão para não gerar custo ao apenas revisar o template.

  EnableSageMaker:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >
      Cria uma notebook instance SageMaker (substituto do treino local em machine-learning/).
      Mantido desligado por padrão para não gerar custo ao apenas revisar o template.

  RedshiftAdminUsername:
    Type: String
    Default: admin
    Description: Usuário administrador do Redshift Serverless (usado apenas se EnableRedshift=true).

  RedshiftAdminPassword:
    Type: String
    NoEcho: true
    Default: ChangeMe123!
    Description: Senha do usuário administrador do Redshift Serverless (troque antes de aplicar).

  SageMakerInstanceType:
    Type: String
    Default: ml.t3.medium
    Description: Instance type da notebook do SageMaker (usado apenas se EnableSageMaker=true).

Conditions:
  CreateRedshift: !Equals [!Ref EnableRedshift, "true"]
  CreateSageMaker: !Equals [!Ref EnableSageMaker, "true"]

Resources:

  # ---------------------------------------------------------------------
  # Armazenamento (equivalente a s3/): bucket com as mesmas camadas
  # bronze/silver/gold usadas na implementação real.
  # ---------------------------------------------------------------------
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${BucketSuffix}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  DataLakeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/pipeline"
      RetentionInDays: 30

  # ---------------------------------------------------------------------
  # Processamento/catalogação (equivalente a s3/processing.py + dbt staging):
  # Glue Data Catalog + Crawler + Job.
  # ---------------------------------------------------------------------
  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-glue-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: s3-data-lake-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataLakeBucket.Arn
                  - !Sub "${DataLakeBucket.Arn}/*"

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "${ProjectName}_catalog"
        Description: "Catalogo dos dados brutos/tratados do pipeline Amazon Sales & Reviews"

  BronzeCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub "${ProjectName}-bronze-crawler"
      Role: !GetAtt GlueServiceRole.Arn
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub "s3://${DataLakeBucket}/bronze/"
      Schedule:
        ScheduleExpression: "cron(0 6 * * ? *)"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

  ProcessingGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "${ProjectName}-bronze-to-silver"
      Role: !GetAtt GlueServiceRole.Arn
      GlueVersion: "4.0"
      Command:
        Name: glueetl
        PythonVersion: "3"
        # Substitua pelo caminho real do script (versao Glue-native de s3/processing.py) antes
        # de aplicar o template - o bucket comeca vazio.
        ScriptLocation: !Sub "s3://${DataLakeBucket}/scripts/bronze_to_silver.py"
      DefaultArguments:
        "--TempDir": !Sub "s3://${DataLakeBucket}/tmp/"
        "--job-language": "python"
      MaxRetries: 1
      NumberOfWorkers: 2
      WorkerType: G.1X
      Timeout: 30

  # ---------------------------------------------------------------------
  # Base analitica (equivalente ao Snowflake): Redshift Serverless, opcional
  # ---------------------------------------------------------------------
  RedshiftNamespace:
    Type: AWS::RedshiftServerless::Namespace
    Condition: CreateRedshift
    Properties:
      NamespaceName: !Sub "${ProjectName}-ns"
      DbName: analytics
      AdminUsername: !Ref RedshiftAdminUsername
      AdminUserPassword: !Ref RedshiftAdminPassword
      IamRoles:
        - !GetAtt GlueServiceRole.Arn

  RedshiftWorkgroup:
    Type: AWS::RedshiftServerless::Workgroup
    Condition: CreateRedshift
    Properties:
      WorkgroupName: !Sub "${ProjectName}-wg"
      NamespaceName: !Ref RedshiftNamespace
      BaseCapacity: 8
      PubliclyAccessible: false

  # ---------------------------------------------------------------------
  # Machine Learning (equivalente a machine-learning/): SageMaker, opcional
  # ---------------------------------------------------------------------
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateSageMaker
    Properties:
      RoleName: !Sub "${ProjectName}-sagemaker-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: s3-data-lake-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataLakeBucket.Arn
                  - !Sub "${DataLakeBucket.Arn}/*"

  SentimentModelNotebook:
    Type: AWS::SageMaker::NotebookInstance
    Condition: CreateSageMaker
    Properties:
      NotebookInstanceName: !Sub "${ProjectName}-sentiment-notebook"
      InstanceType: !Ref SageMakerInstanceType
      RoleArn: !GetAtt SageMakerExecutionRole.Arn

Outputs:
  DataLakeBucketName:
    Description: Bucket S3 com as camadas bronze/silver/gold
    Value: !Ref DataLakeBucket

  GlueDatabaseName:
    Description: Database do Glue Data Catalog
    Value: !Ref GlueDatabase

  RedshiftWorkgroupEndpoint:
    Condition: CreateRedshift
    Description: Endpoint do Redshift Serverless (base analitica equivalente ao Snowflake)
    Value: !GetAtt RedshiftWorkgroup.Workgroup.Endpoint.Address

  SageMakerNotebookName:
    Condition: CreateSageMaker
    Description: Notebook instance do SageMaker (treino/experimentacao de ML)
    Value: !Ref SentimentModelNotebook
