name: olist-pipeline

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    # Precisa ser IDÊNTICA em todos os componentes (webserver/scheduler) - é o que o
    # webserver usa para autenticar a busca de logs no scheduler (porta 8793). Se não for
    # fixada aqui, cada container gera uma aleatória e a UI retorna 403 ao abrir logs.
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-}
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
    SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
    SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
    SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
    SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
    SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-ANALYTICS}
    SNOWFLAKE_STORAGE_INTEGRATION: ${SNOWFLAKE_STORAGE_INTEGRATION:-}
    SNOWFLAKE_S3_ROLE_ARN: ${SNOWFLAKE_S3_ROLE_ARN:-}
    PIPELINE_USE_SAMPLE_DATA: ${PIPELINE_USE_SAMPLE_DATA:-false}
  volumes:
    - .:/opt/airflow/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME:-Admin}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME:-User}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  metabase-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${METABASE_DB_USER:-metabase}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase}
      POSTGRES_DB: ${METABASE_DB_NAME:-metabase}
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.50.20
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME:-metabase}
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER:-metabase}
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase}
      MB_DB_HOST: metabase-db
    depends_on:
      - metabase-db
    restart: unless-stopped

  # Job one-shot: espera o Metabase subir e provisiona admin + conexão Snowflake +
  # dashboard/cards automaticamente (ver dashboard/setup_metabase.py). Roda uma vez a
  # cada "docker compose up" e sai; é idempotente (reaproveita o que já existir).
  metabase-setup:
    image: python:3.11-slim
    working_dir: /dashboard
    volumes:
      - ./dashboard:/dashboard
    environment:
      METABASE_URL: http://metabase:3000/api
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@example.com}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-Admin123456!}
      METABASE_ADMIN_FIRSTNAME: ${METABASE_ADMIN_FIRSTNAME:-Admin}
      METABASE_ADMIN_LASTNAME: ${METABASE_ADMIN_LASTNAME:-User}
      METABASE_SITE_NAME: ${METABASE_SITE_NAME:-Olist}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-ANALYTICS}
    command: sh -c "pip install --quiet --no-cache-dir -r requirements.txt && python setup_metabase.py"
    depends_on:
      - metabase
    restart: "no"

volumes:
  airflow_postgres_data:
  metabase_postgres_data:
