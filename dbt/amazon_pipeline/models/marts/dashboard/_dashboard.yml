version: 2

models:
  - name: mart_sentiment_kpis
    description: "Indicadores de sentimento/rating por produto e categoria, consumidos pelo dashboard Metabase."
    columns:
      - name: product_id
        tests:
          - not_null

  - name: mart_ml_results
    description: "Predições de sentimento (hard-code vs. sklearn) do conjunto de teste, com produto/categoria associados."
    columns:
      - name: review_id
        tests:
          - not_null
      - name: true_label
        tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']
