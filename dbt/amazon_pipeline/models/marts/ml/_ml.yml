version: 2

models:
  - name: ml_feature_table
    description: "Base de treino/inferência do módulo machine-learning/: texto da review + rótulo + atributos estruturados do produto."
    columns:
      - name: review_key
        tests:
          - not_null
          - unique
      - name: sentiment_label
        tests:
          - not_null
