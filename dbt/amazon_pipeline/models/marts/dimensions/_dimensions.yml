version: 2

models:
  - name: dim_product
    description: "Um registro por produto do catálogo (grão: product_id)."
    columns:
      - name: product_key
        description: "Chave substituta (hash de product_id)."
        tests:
          - not_null
          - unique
      - name: product_id
        tests:
          - not_null
          - unique

  - name: dim_category
    description: "Um registro por categoria raiz de produto, com métricas agregadas."
    columns:
      - name: category_key
        tests:
          - not_null
          - unique
      - name: category_root
        tests:
          - not_null
