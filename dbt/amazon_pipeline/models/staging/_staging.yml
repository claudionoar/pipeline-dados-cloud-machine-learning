version: 2

sources:
  - name: raw
    description: "Tabelas carregadas via COPY INTO a partir da camada silver do S3 (schema fixo RAW, ver snowflake/sql/)."
    schema: RAW
    tables:
      - name: sales
        description: "Catálogo de produtos (dados estruturados) normalizado por s3/processing.py."
      - name: reviews
        description: "Reviews de texto (dados não estruturados) com rótulo de sentimento derivado do rating."
      - name: ml_predictions
        description: "Predições do conjunto de teste geradas pelo módulo machine-learning/."

models:
  - name: stg_sales
    description: "Staging 1:1 sobre raw.sales, sem transformação além de seleção de colunas."
    columns:
      - name: product_id
        description: "Identificador único do produto (ASIN)."
        tests:
          - not_null
          - unique
      - name: rating
        description: "Rating médio do produto (1 a 5)."
        tests:
          - not_null

  - name: stg_reviews
    description: "Staging 1:1 sobre raw.reviews."
    columns:
      - name: review_id
        description: "Identificador único da review."
        tests:
          - not_null
          - unique
      - name: sentiment_label
        description: "Sentimento derivado do rating da review (positive/neutral/negative)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']

  - name: stg_ml_predictions
    description: "Staging 1:1 sobre raw.ml_predictions."
    columns:
      - name: review_id
        description: "Review avaliada pelos dois modelos (hard-code e sklearn)."
        tests:
          - not_null
