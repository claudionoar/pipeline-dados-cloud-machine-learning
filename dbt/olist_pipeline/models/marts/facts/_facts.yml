version: 2

models:
  - name: fact_orders
    description: "Um registro por pedido (grão: order_id), com métricas de atraso na entrega (is_late)."
    columns:
      - name: order_key
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced',
                         'processing', 'created', 'approved']

  - name: fact_order_items
    description: "Um registro por item de pedido (grão: order_id + order_item_id)."
    columns:
      - name: order_item_key
        tests:
          - not_null
          - unique
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: seller_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_key

  - name: fact_payments
    description: "Um registro por pagamento de pedido (grão: order_id + payment_sequential)."
    columns:
      - name: payment_key
        tests:
          - not_null
          - unique

  - name: fact_reviews
    description: "Um registro por review (grão: review_id), com sentimento derivado do review_score e FK para fact_orders."
    columns:
      - name: review_key
        tests:
          - not_null
          - unique
      - name: sentiment_label
        tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']
      - name: order_key
        tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_key
